<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ølkartet Oslo — billigst øl i byen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div id="panel-handle" aria-hidden="true"><span></span></div>

    <div id="panel-content">
      <h1>🍺 Ølkartet Oslo</h1>
      <p class="subtitle">Billigste halvliter per utested, fra <a href="https://www.pilsguiden.no/liste/oslo" target="_blank" rel="noopener">Pilsguiden</a></p>

      <div class="row">
        <button id="locate-btn">📍 Finn meg</button>
        <span id="locate-status"></span>
      </div>

      <div class="row price-filter">
        <div class="price-filter-controls">
          <label>Pris per halvliter: <strong id="price-range-label"></strong></label>

          <div class="stepper-row">
            <span class="stepper-label">Max</span>
            <button type="button" class="step-btn" data-target="max" data-delta="-5" aria-label="Senk maksimum med 5 kr">−5</button>
            <span class="stepper-value" id="max-value"></span>
            <button type="button" class="step-btn" data-target="max" data-delta="5" aria-label="Øk maksimum med 5 kr">+5</button>
          </div>
        </div>

        <div class="slider" id="slider">
          <div class="slider-track"></div>
          <div class="slider-range" id="slider-range"></div>
          <input type="range" id="slider-min" step="1" />
          <input type="range" id="slider-max" step="1" />
        </div>
      </div>

      <div class="legend">
        <span class="legend-label" id="legend-min">Billig</span>
        <div class="legend-gradient"></div>
        <span class="legend-label" id="legend-max">Dyrt</span>
      </div>

      <div class="row">
        <button type="button" id="toggle-nearby-btn"></button>
      </div>

      <div class="row stats">
        <span id="visible-count"></span>
      </div>

      <div class="row stale-note">
        <span class="dot stale-dot"></span> = pris sjekket for 14+ dager siden
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
