<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ølkartet Oslo — billigst øl i byen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div id="panel-handle" aria-hidden="true"><span></span></div>

    <div id="panel-content">
      <div class="row auth-row" id="auth-row">
        <button type="button" id="google-signin-btn" class="auth-btn">🔑 Logg inn med Google</button>
        <div id="user-chip" class="user-chip" hidden>
          <span id="user-name"></span>
          <button type="button" id="sign-out-btn" class="text-btn">Logg ut</button>
        </div>
      </div>

      <div class="row">
        <button type="button" id="add-bar-btn">➕ Legg til utested</button>
      </div>

      <form class="add-bar-form" id="add-bar-form" hidden>
        <div class="add-bar-field">
          <label for="add-bar-name">Navn</label>
          <input type="text" id="add-bar-name" maxlength="120" required />
        </div>
        <div class="add-bar-field">
          <label for="add-bar-address">Adresse (valgfritt)</label>
          <div class="add-bar-address-row">
            <input type="text" id="add-bar-address" maxlength="200" />
            <button type="button" id="add-bar-geocode-btn" class="text-btn">Finn på kart</button>
          </div>
        </div>
        <p class="add-bar-hint">Dra nålen i kartet for å justere plasseringen.</p>
        <button type="button" id="add-bar-use-location-btn" class="text-btn">📍 Bruk min posisjon</button>
        <div class="add-bar-field">
          <label for="add-bar-size">Størrelse</label>
          <select id="add-bar-size"></select>
        </div>
        <div class="add-bar-field">
          <label for="add-bar-price">Pris (kr)</label>
          <input type="number" id="add-bar-price" min="1" max="999" step="1" required />
        </div>
        <div class="add-bar-actions">
          <button type="submit" id="add-bar-save-btn" class="popup-btn">Lagre</button>
          <button type="button" id="add-bar-cancel-btn" class="text-btn">Avbryt</button>
        </div>
        <p class="add-bar-status" id="add-bar-status"></p>
      </form>

      <div class="row price-filter">
        <div class="price-filter-controls">
          <div class="price-filter-header">
            <label>Pris <strong id="price-range-label"></strong></label>
            <div class="stepper-row" role="group" aria-label="Juster maksimumspris">
              <button type="button" class="step-btn" data-target="max" data-delta="-5" aria-label="Senk maksimum med 5 kr">−</button>
              <button type="button" class="step-btn" data-target="max" data-delta="5" aria-label="Øk maksimum med 5 kr">+</button>
            </div>
          </div>
        </div>

        <div class="slider" id="slider">
          <div class="slider-track"></div>
          <div class="slider-range" id="slider-range"></div>
          <input type="range" id="slider-min" step="1" />
          <input type="range" id="slider-max" step="1" />
        </div>
      </div>

      <div class="row">
        <button type="button" id="toggle-nearby-btn"></button>
      </div>

      <div class="row stats">
        <span id="visible-count"></span>
      </div>

      <details class="info-disclosure">
        <summary>Tegnforklaring</summary>
        <div class="legend">
          <span class="legend-label" id="legend-min">Billig</span>
          <div class="legend-gradient"></div>
          <span class="legend-label" id="legend-max">Dyrt</span>
        </div>
        <div class="stale-note">
          <span class="dot stale-dot"></span> pris sjekket for 14+ dager siden
        </div>
        <div class="shape-note">
          <span class="shape-sample shape-circle"></span> vanlig pris
          <span class="shape-sample shape-square"></span> happy hour
        </div>
        <div class="community-note">
          <span class="community-badge-sample">👥</span> pris meldt inn av brukere
        </div>
      </details>

      <details class="info-disclosure admin-panel" id="admin-panel" hidden>
        <summary>🛡 Admin</summary>
        <div class="admin-feed" id="admin-feed"></div>
      </details>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
